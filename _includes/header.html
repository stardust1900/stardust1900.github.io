<header class="site-header">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-5">
    <a href="{{ '/' | relative_url }}" class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">{{ site.title }}</a>

    <nav class="hidden items-center gap-6 md:flex">
      {% for i in site.nav %}
        <a href="{{ i[1] }}" {% if i[1] contains 'http' %}target="_blank" rel="noopener"{% endif %}
           class="text-sm text-slate-600 transition hover:text-brand dark:text-slate-300 dark:hover:text-brand">{{ i[0] }}</a>
      {% endfor %}
    </nav>

    <div class="flex items-center gap-1">
      <button id="theme-toggle" type="button"
              class="rounded-full p-2 text-slate-500 transition hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-slate-800"
              aria-label="切换明暗主题">
        <span class="hidden dark:block">{% include icon.html name='sun' %}</span>
        <span class="block dark:hidden">{% include icon.html name='moon' %}</span>
      </button>
      <button id="menu-toggle" type="button"
              class="rounded-full p-2 text-slate-500 transition hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-slate-800 md:hidden"
              aria-label="打开菜单" aria-expanded="false">
        {% include icon.html name='menu' %}
      </button>
    </div>
  </div>

  <nav id="mobile-menu" class="hidden border-t border-slate-200/70 px-5 py-3 dark:border-slate-700/60 md:hidden">
    {% for i in site.nav %}
      <a href="{{ i[1] }}" {% if i[1] contains 'http' %}target="_blank" rel="noopener"{% endif %}
         class="block py-2 text-sm text-slate-600 transition hover:text-brand dark:text-slate-300 dark:hover:text-brand">{{ i[0] }}</a>
    {% endfor %}
  </nav>
</header>
