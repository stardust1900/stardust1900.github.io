---
title: Tags
layout: default
---

<section class="relative overflow-hidden bg-gradient-to-br from-brand to-indigo-600 px-5 py-16 text-center text-white">
  <h1 class="text-3xl font-bold sm:text-4xl">TAGS</h1>
</section>

<main class="mx-auto max-w-reader px-5 py-10">
  <div class="ui-card mb-8 flex flex-wrap gap-2">
    {% if site.recommend-tags and site.tags.size > 0 %}
      {% for tag in site.tags %}
      <a href="#{{ tag[0] }}" class="ui-tag">{{ tag[0] }}</a>
      {% endfor %}
    {% endif %}
  </div>

  <div class="space-y-6">
    {% for tag in site.tags %}
    <section class="ui-card scroll-mt-20" id="{{ tag[0] }}">
      <h2 class="mb-3 text-lg font-semibold text-slate-900 dark:text-white">「{{ tag[0] }}」</h2>
      <ul class="space-y-1.5 text-sm">
        {% for post in tag[1] %}
        <li>
          <a href="{{ post.url }}" class="text-slate-600 transition hover:text-brand dark:text-slate-300 dark:hover:text-brand">{{ post.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </section>
    {% endfor %}
  </div>
</main>
