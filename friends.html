---
title: 友链
layout: default
---

<section class="relative overflow-hidden bg-gradient-to-br from-brand to-indigo-600 px-5 py-16 text-center text-white">
  <h1 class="text-3xl font-bold sm:text-4xl">友链</h1>
  <p class="mt-3 text-white/80">与有趣的灵魂互相链接</p>
</section>

<main class="mx-auto max-w-5xl px-5 py-10">
  <div class="ui-card mb-8">
    <span class="ui-tag mb-3">申请友链</span>
    <p class="text-sm leading-relaxed text-slate-500 dark:text-slate-400">
      在下方评论区留言申请，格式：站点名称 / 网址 / Logo 地址 / 一句话简介。审核通过后会尽快添加。
    </p>
  </div>

  <ul class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
    {% for friend in site.data.friends %}
    <li class="ui-card group relative flex flex-col items-center text-center">
      <a class="friend-link absolute inset-0" href="{{ friend.url }}" target="_blank" rel="noopener" title="{{ friend.name }}"></a>
      <img class="friend-logo h-16 w-16 rounded-full object-cover shadow-soft"
           src="{{ friend.logo }}" alt="{{ friend.name }}"
           onerror="this.src='{{ '/assets/img/profile.png' | relative_url }}'">
      <h3 class="friend-name mt-3 w-full truncate text-base font-semibold text-slate-900 dark:text-white">{{ friend.name }}</h3>
      <p class="friend-desc mt-1 line-clamp-2 text-xs text-slate-400 dark:text-slate-500">{{ friend.desc }}</p>
    </li>
    {% endfor %}
  </ul>

  <section class="ui-card mt-10">
    <div id="friends-comments">
      <script src="https://utteranc.es/client.js"
              repo="stardust1900/stardust1900.github.io"
              issue-term="友链申请"
              label="comment"
              theme="github-light"
              crossorigin="anonymous"
              async>
      </script>
    </div>
  </section>
</main>
